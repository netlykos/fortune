version: v2
plugins:
  # Java Standard Protobuf Messages (Base data structures used by Groovy)
  - remote: buf.build/protocolbuffers/java:v29.3
    out: java

  # Java gRPC Base Stubs
  - remote: buf.build/grpc/java:v1.69.0
    out: java

  # JavaScript Standard Protobuf Code
  - remote: buf.build/protocolbuffers/js:v3.21.2
    out: js/public

  # JavaScript gRPC Web Stubs (for browser/web clients)
  - remote: buf.build/grpc/web:v1.5.0
    out: js/public
    opt:
      - mode=grpcwebtext
